<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoWise Print - Job Bible</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2b2b2b; /* Dark theme background */
            --col-bg: #44384a; 
            --card-bg: #ffffff;
            --text-main: #172b4d;
            --text-muted: #5e6c84;
            --text-light: #ffffff;
            --primary: #fd13f0; /* Gowise Brand Magenta */
            --primary-hover: #d610cb;
            --border-color: #555555;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px 30px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* Top Logo & Navigation Alignment */
        .top-header-container {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo-placeholder {
            width: 200px;
            height: auto;
        }

        nav {
            display: flex;
            align-items: center;
            font-weight: 400;
            gap: 15px;
        }
        nav a {
            text-decoration: none;
            color: #aaaaaa;
            font-size: 15px;
            transition: color 0.2s;
        }
        nav a:hover { color: var(--primary); }
        nav a.active { color: var(--primary); font-weight: 600; }
        .nav-divider {
            color: #aaaaaa;
            user-select: none;
        }

        /* Sub-Header Toolbar */
        .toolbar-header {
            width: 100%;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .toolbar-title-group {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        h1 { 
            font-size: 26px; 
            margin: 0; 
            font-weight: 300; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: var(--text-light);
        }

        /* Compact Alphabet Buttons Inline with Title */
        .alpha-nav-container {
            display: flex;
            gap: 10px;
        }

        .alpha-btn {
            background-color: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .alpha-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        .alpha-btn.active-alpha {
            background-color: #ffffff;
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(253, 19, 240, 0.4);
        }

        .btn-primary { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        /* Job Bible Specific Styles */
        .bible-section {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .bible-section.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1000px;
            margin-top: 10px;
            padding-bottom: 40px;
        }

        /* Matches the Pipeline Card Style */
        .square-btn {
            width: 180px;
            height: 180px;
            background-color: var(--card-bg);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            padding: 15px;
            box-sizing: border-box;
            border-left: 6px solid var(--primary);
        }

        .square-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .square-btn h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-main); word-break: break-word; line-height: 1.3; }
        .square-btn p { margin-top: 10px; font-size: 13px; color: var(--text-muted); font-weight: 600; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); overflow-y: auto; }
        
        .modal-content { 
            background-color: #ffffff; 
            color: var(--text-main);
            margin: 5% auto; 
            padding: 30px; 
            border-radius: 8px; 
            width: 90%; 
            max-width: 1000px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            position: relative; 
        }
        
        .close { position: absolute; right: 20px; top: 15px; color: #888; font-size: 28px; font-weight: bold; cursor: pointer; line-height: 1; }
        .close:hover { color: var(--primary); }
        
        .note-item {
            background-color: #ebecf0;
            padding: 12px 65px 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
            font-size: 14px;
            white-space: pre-wrap;
            line-height: 1.4;
            color: var(--text-main);
            width: fit-content; 
            max-width: 100%; 
            word-wrap: break-word;
        }
        
        .note-action {
            position: absolute;
            top: 10px;
            color: #a5adba;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: color 0.2s;
        }
        
        .note-edit { right: 35px; }
        .note-edit:hover { color: var(--primary); }
        
        .note-delete { right: 12px; }
        .note-delete:hover { color: #de350b; }

        /* Form Inputs inside Modals */
        input[type="text"], input[type="email"], select, textarea {
            width: 100%; 
            padding: 10px; 
            border: 2px solid #dfe1e6; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-family: inherit;
        }
        input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus { 
            border-color: var(--primary); 
            outline: none; 
        }
    </style>
</head>
<body>

    <!-- Top Branding & Navigation -->
    <div class="top-header-container">
        <!-- Replace src with your actual logo path -->
        <img src="gowise-logo.png" alt="GoWise Print Logo" class="logo-placeholder" onerror="this.style.display='none';">
        <nav>
            <a href="/">Production Pipeline</a>
            <span class="nav-divider">|</span>
            <a href="/customers">Client Directory</a>
            <span class="nav-divider">|</span>
            <a href="/job_bible" class="active">Job Bible</a>
            <span class="nav-divider">|</span>
            <a href="/job_archive">Job Archive</a>
        </nav>
    </div>

    <!-- Permanent Toolbar Header & Alphabet Navigation -->
    <div class="toolbar-header">
        <div class="toolbar-title-group">
            <h1>Job Bible</h1>
            <div id="alpha-nav" class="alpha-nav-container"></div>
        </div>
        
        <!-- Main Controls (Default) -->
        <div id="main-controls" style="display: flex; gap: 10px;">
            <button class="btn-primary" onclick="openAddClientModal()">+ Add Client</button>
        </div>

        <!-- Controls that only appear when deep inside a client's page -->
        <div id="job-controls" style="display: none; gap: 10px;">
            <button class="btn-primary" style="background-color: #555;" onclick="showView('view-customers')">⬅ Back to Clients</button>
            <button class="btn-primary" style="background-color: #de350b;" onclick="deleteClient()">Delete Client</button>
            <button class="btn-primary" onclick="openAddCategoryModal()">+ Add Category</button>
        </div>
    </div>

    <!-- LEVEL 1: Customers (Default View) -->
    <div id="view-customers" class="bible-section active">
        <div class="grid-container" id="grid-customers"></div>
    </div>

    <!-- LEVEL 2: Jobs & Categories -->
    <div id="view-jobs" class="bible-section">
        <h2 id="job-header-title" style="margin: 0 0 20px 0; font-size: 20px; font-weight: 400; color: var(--text-light);">Client Jobs</h2>
        <div class="grid-container" id="grid-jobs"></div>
    </div>

    <!-- LEVEL 3: Notes Modal -->
    <div id="notesModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <div>
                    <h2 style="margin: 0; color: var(--primary);" id="modal-job-title">Job Title</h2>
                    <button onclick="deleteCategory()" style="background: none; border: none; color: #de350b; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 5px;">Delete Category</button>
                </div>
                <button class="btn-primary" style="margin-right: 35px;" onclick="toggleAddNote()">+ Add Note</button>
            </div>
            
            <div id="notes-container" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;"></div>

            <div id="add-note-section" style="display: none; margin-top: 20px;">
                <textarea id="new-note-text" rows="4" placeholder="Type new note here..."></textarea>
                <button id="save-note-btn" class="btn-primary" style="margin-top: 10px; width: 100%; padding: 12px;" onclick="saveNote()">Save Note</button>
            </div>
        </div>
    </div>

    <!-- NEW ADD CLIENT MODAL -->
    <div id="addClientModal" class="modal">
        <div class="modal-content" style="width: 600px; max-width: 90%;">
            <span class="close" onclick="closeAddClientModal()">&times;</span>
            <h2 style="margin-top: 0; color: var(--primary);">Add New Client</h2>
            
            <div style="margin-top: 20px;">
                <label for="new-client-name" style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: var(--text-muted);">Client Name</label>
                <input type="text" id="new-client-name" placeholder="e.g., Acme Corp" style="margin-bottom: 20px;">
                
                <button class="btn-primary" id="save-client-btn" style="width: 100%; padding: 12px;" onclick="saveNewClient()">Create Client</button>
            </div>
        </div>
    </div>

    <!-- NEW ADD CATEGORY MODAL -->
    <div id="addCategoryModal" class="modal">
        <div class="modal-content" style="width: 600px; max-width: 90%;">
            <span class="close" onclick="closeAddCategoryModal()">&times;</span>
            <h2 style="margin-top: 0; color: var(--primary);">Add New Category</h2>
            
            <div style="margin-top: 20px;">
                <label for="new-category-title" style="display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: var(--text-muted);">Category Name</label>
                <input type="text" id="new-category-title" placeholder="e.g., A6 Leaflets, Business Cards" style="margin-bottom: 20px;">
                
                <button class="btn-primary" id="save-category-btn" style="width: 100%; padding: 12px;" onclick="saveNewCategory()">Create Category</button>
            </div>
        </div>
    </div>

    <script>
        const customers = {{ customers | tojson | safe }};
        const jobs = {{ jobs | tojson | safe }};
        
        let currentActiveCustomerId = null;
        let currentActiveTitle = null;
        let editingNoteIndex = null; 

        const ranges = [
            { label: 'A - F', regex: /^[A-Fa-f]/ },
            { label: 'G - L', regex: /^[G-Lg-l]/ },
            { label: 'M - R', regex: /^[M-Rm-r]/ },
            { label: 'S - Z', regex: /^[S-Zs-z]/ },
            { label: '0 - 9 & Other', regex: /^[^A-Za-z]/ }
        ];

        function showView(viewId) {
            document.querySelectorAll('.bible-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // Toggle the top-right controls based on the view
            if(viewId === 'view-jobs') {
                document.getElementById('job-controls').style.display = 'flex';
                document.getElementById('main-controls').style.display = 'none';
            } else {
                document.getElementById('job-controls').style.display = 'none';
                document.getElementById('main-controls').style.display = 'flex';
            }
        }

        // Initialize the permanent top alphabet navigation
        function initAlpha() {
            const nav = document.getElementById('alpha-nav');
            nav.innerHTML = '';
            
            ranges.forEach((range, index) => {
                const btn = document.createElement('div');
                btn.className = 'alpha-btn';
                btn.innerText = range.label;
                
                btn.onclick = () => {
                    // Update active styling
                    document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active-alpha'));
                    btn.classList.add('active-alpha');
                    // Load the corresponding clients
                    loadCustomers(index);
                };
                
                nav.appendChild(btn);
            });

            // Automatically click the first category (A-F) so the page isn't blank on load
            if (nav.firstChild) {
                nav.firstChild.classList.add('active-alpha');
                loadCustomers(0);
            }
        }

        function loadCustomers(rangeIndex) {
            const range = ranges[rangeIndex];
            const filtered = customers.filter(c => range.regex.test(c.company_name));
            
            const grid = document.getElementById('grid-customers');
            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: #aaaaaa; font-size: 16px;">No clients in this category.</p>';
            } else {
                filtered.forEach(c => {
                    const btn = document.createElement('div');
                    btn.className = 'square-btn';
                    btn.innerHTML = `<h3>${c.company_name}</h3>`;
                    btn.onclick = () => loadJobs(c.id, c.company_name);
                    grid.appendChild(btn);
                });
            }
            showView('view-customers');
        }

        function loadJobs(customerId, companyName) {
            currentActiveCustomerId = customerId; 
            
            const clientJobs = jobs.filter(j => j.customer_id === customerId);
            
            document.getElementById('job-header-title').innerText = `${companyName} - Jobs & Categories`;
            const grid = document.getElementById('grid-jobs');
            grid.innerHTML = '';

            if (clientJobs.length === 0) {
                grid.innerHTML = '<p style="color: #aaaaaa; font-size: 16px;">No records found for this client.</p>';
            } else {
                clientJobs.forEach(job => {
                    const btn = document.createElement('div');
                    btn.className = 'square-btn';
                    btn.innerHTML = `<h3>${job.title}</h3>`;
                    btn.onclick = () => openModal(job);
                    grid.appendChild(btn);
                });
            }
            showView('view-jobs');
        }

        function openModal(job) {
            currentActiveCustomerId = job.customer_id;
            currentActiveTitle = job.title;
            
            document.getElementById('modal-job-title').innerText = job.title;
            renderNotes(job.notes);
            
            document.getElementById('add-note-section').style.display = 'none';
            document.getElementById('new-note-text').value = '';
            document.getElementById('save-note-btn').innerText = 'Save Note';
            editingNoteIndex = null;
            
            document.getElementById('notesModal').style.display = 'block';
        }
        
        function renderNotes(notesArray) {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            
            if (!notesArray || notesArray.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 20px; border: 1px dashed #dfe1e6; border-radius: 6px;">No notes recorded yet.</div>';
                return;
            }
            
            notesArray.forEach((note, index) => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `${note}<span class="note-action note-edit" onclick="editNote(${index})" title="Edit Note">✎</span><span class="note-action note-delete" onclick="deleteNote(${index})" title="Delete Note">✕</span>`;
                container.appendChild(div);
            });
        }

        function closeModal() {
            document.getElementById('notesModal').style.display = 'none';
            editingNoteIndex = null;
        }

        function toggleAddNote() {
            const section = document.getElementById('add-note-section');
            if (section.style.display === 'none') {
                section.style.display = 'block';
                document.getElementById('new-note-text').value = '';
                document.getElementById('save-note-btn').innerText = 'Save Note';
                editingNoteIndex = null;
                document.getElementById('new-note-text').focus();
            } else {
                section.style.display = 'none';
            }
        }

        // --- Note Editing Logic ---
        function editNote(index) {
            editingNoteIndex = index;
            const jobIndex = jobs.findIndex(j => j.customer_id === currentActiveCustomerId && j.title.toLowerCase() === currentActiveTitle.toLowerCase());
            
            if (jobIndex !== -1) {
                document.getElementById('new-note-text').value = jobs[jobIndex].notes[index];
                document.getElementById('add-note-section').style.display = 'block';
                document.getElementById('save-note-btn').innerText = 'Update Note';
                document.getElementById('new-note-text').focus();
            }
        }

        function saveNote() {
            const newText = document.getElementById('new-note-text').value;
            if (!newText.trim()) return;

            const btn = document.getElementById('save-note-btn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            const isEditing = editingNoteIndex !== null;
            const endpoint = isEditing ? '/edit_job_note' : '/save_job_note';
            
            const payload = { 
                customer_id: currentActiveCustomerId, 
                title: currentActiveTitle 
            };

            if (isEditing) {
                payload.index = editingNoteIndex;
                payload.text = newText;
            } else {
                payload.note = newText;
            }

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderNotes(data.updated_notes);
                    document.getElementById('add-note-section').style.display = 'none';
                    document.getElementById('new-note-text').value = '';
                    
                    const jobIndex = jobs.findIndex(j => j.customer_id === currentActiveCustomerId && j.title.toLowerCase() === currentActiveTitle.toLowerCase());
                    if (jobIndex !== -1) jobs[jobIndex].notes = data.updated_notes;
                } else {
                    alert("Error saving note.");
                }
                btn.innerText = 'Save Note';
                btn.disabled = false;
                editingNoteIndex = null;
            });
        }
        
        function deleteNote(index) {
            if (!confirm("Are you sure you want to delete this note?")) return;
            
            fetch('/delete_job_note', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    customer_id: currentActiveCustomerId, 
                    title: currentActiveTitle, 
                    index: index 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderNotes(data.updated_notes);
                    const jobIndex = jobs.findIndex(j => j.customer_id === currentActiveCustomerId && j.title.toLowerCase() === currentActiveTitle.toLowerCase());
                    if (jobIndex !== -1) jobs[jobIndex].notes = data.updated_notes;
                } else {
                    alert("Error deleting note.");
                }
            });
        }

        // --- Client & Category Deletion ---
        function deleteClient() {
            if (!confirm("Are you sure you want to delete this client? Their active jobs will remain on the pipeline but lose their client link.")) return;

            fetch(`/delete_customer/${currentActiveCustomerId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) window.location.reload(); 
                else alert("Error deleting client.");
            });
        }

        function deleteCategory() {
            if (!confirm("Are you sure you want to completely delete this category and all of its notes?")) return;

            fetch('/delete_bible_category', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    customer_id: currentActiveCustomerId,
                    title: currentActiveTitle
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) window.location.reload(); 
                else alert("Error deleting category.");
            });
        }

        // --- Add Modals ---
        function openAddClientModal() {
            document.getElementById('new-client-name').value = '';
            document.getElementById('addClientModal').style.display = 'block';
        }

        function closeAddClientModal() {
            document.getElementById('addClientModal').style.display = 'none';
        }

        function saveNewClient() {
            const clientName = document.getElementById('new-client-name').value.trim();
            if (!clientName) { alert("Please enter a Client Name."); return; }

            const btn = document.getElementById('save-client-btn');
            btn.innerText = 'Creating...';
            btn.disabled = true;

            fetch('/add_customer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company_name: clientName })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) window.location.reload(); 
                else { alert("Error creating client: " + (data.error || "Unknown error")); btn.innerText = 'Create Client'; btn.disabled = false; }
            });
        }

        function openAddCategoryModal() {
            document.getElementById('new-category-title').value = '';
            document.getElementById('addCategoryModal').style.display = 'block';
        }

        function closeAddCategoryModal() {
            document.getElementById('addCategoryModal').style.display = 'none';
        }

        function saveNewCategory() {
            const categoryTitle = document.getElementById('new-category-title').value.trim();
            if (!categoryTitle) { alert("Please enter a Category Name."); return; }

            const btn = document.getElementById('save-category-btn');
            btn.innerText = 'Creating...';
            btn.disabled = true;

            const dummyJobNumber = 'CAT-' + Math.floor(Math.random() * 1000000);

            fetch('/add_bible_category', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_number: dummyJobNumber, customer_id: currentActiveCustomerId, title: categoryTitle })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) window.location.reload(); 
                else { alert("Error creating category: " + (data.error || "Unknown error")); btn.innerText = 'Create Category'; btn.disabled = false; }
            });
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('notesModal')) closeModal();
            if (event.target == document.getElementById('addClientModal')) closeAddClientModal();
            if (event.target == document.getElementById('addCategoryModal')) closeAddCategoryModal();
        }

        initAlpha();
    </script>
</body>
</html>
